name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run against the latest TYPO3 releases, so breakage shows up without a push
    - cron: '17 4 * * 1'

jobs:
  tests:
    name: TYPO3 ${{ matrix.typo3 }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { typo3: '^13.4', php: '8.2', testing-framework: '^8.2', phpunit: '^10.5 || ^11.0' }
          - { typo3: '^13.4', php: '8.3', testing-framework: '^8.2', phpunit: '^10.5 || ^11.0' }
          - { typo3: '^13.4', php: '8.4', testing-framework: '^8.2', phpunit: '^10.5 || ^11.0' }
          - { typo3: '^14.0', php: '8.3', testing-framework: '^9.0', phpunit: '^11.5 || ^12.0' }
          - { typo3: '^14.0', php: '8.4', testing-framework: '^9.0', phpunit: '^11.5 || ^12.0' }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite, sqlite3, gd, zip
          coverage: none
          tools: composer:v2

      - name: Pin TYPO3 version for this matrix entry
        run: |
          composer require --no-update \
            "typo3/cms-core:${{ matrix.typo3 }}" \
            "typo3/cms-backend:${{ matrix.typo3 }}" \
            "typo3/cms-fluid:${{ matrix.typo3 }}" \
            "typo3/cms-fluid-styled-content:${{ matrix.typo3 }}" \
            "typo3/cms-frontend:${{ matrix.typo3 }}"
          composer require --no-update --dev \
            "typo3/testing-framework:${{ matrix.testing-framework }}" \
            "phpunit/phpunit:${{ matrix.phpunit }}"

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Coding standards
        run: composer ci:cs

      - name: PHPStan
        run: composer ci:stan

      - name: Unit tests
        run: composer ci:test

      - name: Functional tests (sqlite)
        run: composer ci:test:functional
        env:
          typo3DatabaseDriver: pdo_sqlite
